plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.zhihuminus.richtext'
version = '1.0.0'

expoModule {
  canBePublished false
}

android {
  namespace 'com.zhihuminus.richtext'

  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation 'com.caverock:androidsvg-aar:1.4'
}
